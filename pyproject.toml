[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speculative-decoding-verifier"
version = "0.1.0"
description = "Parallel verification and acceptance arbiter for small-draft model token proposals with temperature scaling"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
speculative-decoding-verifier = "speculative_decoding_verifier.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["speculative_decoding_verifier*"]
